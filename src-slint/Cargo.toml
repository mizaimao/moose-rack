[package]
name = "moose-slint"
version = "0.0.1"
edition = "2024"
publish = false

# A prototype front end in Slint, to judge whether it can replace the Tauri one
# on Android, macOS and Windows. See src-slint/README.md.
#
# Its own workspace on purpose: nothing here reaches the main lockfile or CI
# until the experiment is decided. It shows the real library through `moose_rack`
# (the sample when there is no config), and uses its key and pad bindings.
[workspace]

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit"] }
# Only for MOOSE_SLINT_SNAPSHOT, which saves the window as a picture.
png = "0.18.1"
# The core: the key and pad bindings and the repeat timing the app already uses.
moose-rack = { path = ".." }
# The core's network work (the library update, covers) runs on this, off the
# window's thread.
tokio = { version = "1", features = ["rt-multi-thread"] }
# Shrinks covers to card size before they reach the window.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Controllers on the desktop. On Android they arrive as the system's own key
# events instead. Linked against the SDL3 that Homebrew put on macserver and on
# Frank's laptop, found through pkg-config; a shipped build would link it in.
[target.'cfg(not(target_os = "android"))'.dependencies]
sdl3 = { version = "0.20.0", features = ["use-pkg-config"] }

# Switches for finding where the memory goes. With more than one renderer
# built in, SLINT_BACKEND=winit-femtovg, winit-software or winit-skia picks one
# at run time. `examples/empty.rs` is the floor: a window with nothing in it.
#
# Skia is the default because of what they cost on macserver, 2560x1600 Retina,
# measured with `footprint` (2026-10-31): Skia over Metal 18 MB; FemtoVG over
# OpenGL 147 MB, of which 118 MB is an empty window; the software renderer 81 MB.
[features]
default = ["skia", "accessibility"]
femtovg = ["slint/renderer-femtovg"]
software = ["slint/renderer-software"]
skia = ["slint/renderer-skia"]
accessibility = ["slint/accessibility"]

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = true
