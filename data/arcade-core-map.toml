# Arcade romsets that will not run under their platform's default core.
#
# `"<platform>/<file>" -> core`, keyed by path rather than ROM id because ids
# are reassigned when the server rescans and a rebuilt library would silently
# point these at the wrong games.
#
# Compiled into the binary. This is measured data, not a preference: every
# entry was produced by tools/dat_coverage.py and then verified by launching
# the romset headless against the core, checking it ran frames with nothing
# reported missing. It has no reason to differ between installs, and it used to
# be 240 of config.toml's 368 lines — two thirds of the user's config file
# taken up by something no user should have to read or edit.
#
# `[cores.per_game]` in config.toml still works and wins over anything here, so
# picking a core in the game detail pane overrides a row below.
#
# Romsets absent from this table and not runnable by their default are ones no
# installed core can run — mostly incomplete sets. See docs/arcade-coverage.md.

