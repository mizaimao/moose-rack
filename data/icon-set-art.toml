# Every look each ES-DE theme offers, and where its files live.
#
# Regenerated by tools/survey_icon_sets.py. The directories come from each
# repository's tree; what is *in* them was established by fetching a sample from
# all 142 candidates and looking at every one.
#
# Looking was not optional. Directory names describe their contents wrongly for
# 43 of the 142 — 30%. Three real ones, each previously mapped by name:
#
#     Iconic     _inc/systems/system         a controller, not the console
#     Iconic     _inc/systems/carousel-icons a wordmark, not a controller
#     Meringue   _inc/systems/controllers    the console, not a controller
#
# ## Looks, not three fixed styles
#
# This used to squeeze every theme into hardware / controller / styled text,
# keeping one directory per bucket and discarding the rest. That threw away
# most of what the themes draw — Canvas alone offers nine — and it guaranteed
# a set with no hardware showed something wrong under "Hardware".
#
# So a set now lists whatever it has, in order, and the Select button cycles
# exactly that: nine looks for Canvas, one for a theme with one. `id` is the
# folder the pictures are kept in and the value written to `icons.style`.
#
# 123 looks across 55 sets. Nineteen further directories hold neither a
# console, a controller nor a wordmark — banners, screenshots, box art — and
# are not listed.

[codywheel-es-de]
repo = "Weestuarty-es-de/codywheel-es-de"
branch = "main"
[[codywheel-es-de.looks]]
id = "hardware"
label = "Hardware"
dir = "assets/systemimages"
ext = "png"
[[codywheel-es-de.looks]]
id = "styled-text"
label = "Styled text"
dir = "system/logos/system-logo-white"
ext = "svg"
[[codywheel-es-de.looks]]
id = "styled-text-2"
