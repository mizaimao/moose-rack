## Moose Rack: power
# The device suspends itself after 15 minutes idle, which takes it off the
# network and out of reach — and looks exactly like a black screen. `mode=dim`
# stays, so the screen still dims and the battery is still looked after; it is
# only the extended step that goes.
system.batterysaver.extendedmode=none
## Moose Rack: power end
