# Suspending on idle drops the network and reads as a dead device. Dimming
# stays, so the battery is still looked after.
#
# Both keys, not just the second one. `mode` is the ten-minute hook and
# `extendedmode` the fifteen-minute one, and they are independent: pinning only
# `extendedmode` left the device suspending after ten minutes while this patch
# reported itself on. `dim` rather than `none` because `none` matches no case
# in KNULLI's hook and so loses the dimming as well as the suspend.
system.batterysaver.mode=dim
system.batterysaver.extendedmode=none
