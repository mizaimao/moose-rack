# Our own shader set. It matters that it is ours: configgen resolves a set's
# presets relative to /userdata/shaders, so the preset RetroArch loads ends up
# inside /userdata/shaders/moose -- and RetroArch cycles the directory of the
# preset it loaded, not video_shader_dir. Point it at a stock set and
# Hotkey + D-pad walks the whole 700-preset library, most of which this
# handheld cannot afford.
global.shaderset=moose-lcd
global.retroarch.video_shader_dir=/userdata/shaders/moose
