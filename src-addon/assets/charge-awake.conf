# Never doze off while it is plugged in.
#
# KNULLI already has this: /etc/batteryplus/state.d/batterysaver-chargingbypass
# runs whenever the charge state changes, and on anything but "Discharging" it
# drops a .pause file in /var/run/battery-saver/. Both idle hooks — the one
# that dims and the one that suspends — check for that file and do nothing when
# it is there. So this is a setting, not a daemon: nothing to keep running,
# nothing to restart, and it survives an OS upgrade because it lives in
# knulli.conf.
#
# What it deliberately does NOT touch: closing the lid still suspends
# (lid-control reads system.lid and never looks at the pause file) and the
# power button still suspends (power-button calls knulli-suspend directly).
# Sleeping stays something you can ask for; it just stops happening on its own.
system.batterysaver.chargingbypass=1
