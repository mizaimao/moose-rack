
#
# Everything below is Hotkey (the Menu button) plus the named button.
# Set here rather than in RetroArch's own menu because configgen rewrites
# retroarch.cfg at every launch — which is why changes made inside RetroArch
# did not stick.
#
# Buttons on this device, from es_input.cfg:
#   0=A 1=B 2=X 3=Y 4=L1 5=R1 6=L2 7=R2 8=Select 9=Start 10=Menu
#   13=Up 14=Down 15=Left 16=Right

global.retroarch.input_exit_emulator_btn=1
global.retroarch.quit_press_twice=true
global.retroarch.input_menu_toggle_btn=2
global.retroarch.input_shader_toggle_btn=3
global.retroarch.input_fps_toggle_btn=0
global.retroarch.input_load_state_btn=4
global.retroarch.input_save_state_btn=5
global.retroarch.input_hold_fast_forward_btn=7
global.retroarch.input_pause_toggle_btn=6
global.retroarch.input_state_slot_decrease_btn=15
global.retroarch.input_state_slot_increase_btn=16
global.retroarch.input_shader_prev_btn=13
global.retroarch.input_shader_next_btn=14

# Unbound, because they sat on buttons now used for something else. Every one
# of these was a double binding before: A was reset *and* fps, Y was save state
# *and* shader toggle, L2 and R2 each did two things.
global.retroarch.input_reset_btn=nul
global.retroarch.input_screenshot_btn=nul
global.retroarch.input_ai_service_btn=nul
global.retroarch.input_toggle_fast_forward_btn=nul
global.retroarch.input_rewind_btn=nul
