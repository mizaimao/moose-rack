# moose-service configuration.
#
# Every value here has a command-line flag of the same name, and the flag wins.
# So this file holds the paths that never change, and a flag overrides one for a
# single run without editing anything.
#
# Missing file: fine, the flags alone are a complete way to run this.
# Malformed file: an error, because falling back to defaults would serve the
# wrong library and look like it had worked.
#
#     moose-service --config /etc/moose-service.toml

[library]
# The ES-DE data directory — the one holding gamelists/ and downloaded_media/.
# The only required value.
root = "/home/frank/moose-library/ES-DE"

# Where the games are, if not <root>/ROMs. ES-DE keeps this separate and
# configurable, so it usually is.
roms = "/home/frank/moose-library/ROMs"

# Artwork, if not <root>/downloaded_media. A *portable* ES-DE install keeps it
# under support/ while gamelists stay in the data directory, and then no single
# root derives both.
# media = "/Volumes/Retro/ES-DE/support/downloaded_media"

# The curated .txt lists. Defaults to <root>/collections.
collections = "/home/frank/moose-library/collections"

# BIOS tree. Without it /api/firmware is an empty list.
firmware = "/home/frank/moose-library/bios"

# inventory.db, for the hashes. Without it downloads are size-checked only and
# the client says so out loud.
inventory = "/home/frank/moose-library/inventory.db"

# Where uploaded saves land. Defaults to <root>/saves.
# saves = "/home/frank/moose-library/saves"

# The app's own ui/ directory. Without it there is no web interface and `/`
# serves a plain status page instead.
ui = "/home/frank/moose-rack-src/ui"

# The app's own config.toml, read for the things that are not the library:
# theme, per-game cores, achievements. Relative paths are resolved against the
# working directory, which under systemd is whatever WorkingDirectory says --
# name it absolutely.
#
# The library paths above are NOT repeated in it. Whatever it says about where
# the games are is overridden by this file, so the two cannot disagree.
#
# Optional. Without it the UI runs on defaults and still lists the library.
# app_config = "/home/frank/moose-library/config.toml"

[server]
# Interface and port. `port` overrides whatever `bind` says, which is the common
# case: a different port on the same interface.
bind = "0.0.0.0:80"
# port = 80
#
# Below 1024 needs one thing a systemd *user* unit cannot give itself:
# AmbientCapabilities is system-unit-only, and `setcap` on the binary is wiped
# by the next rebuild. Lower the floor instead, once:
#
#     echo net.ipv4.ip_unprivileged_port_start=80 | sudo tee /etc/sysctl.d/50-moose.conf
#     sudo sysctl --system
#
# A flag or MOOSE_SERVICE_PORT in the unit's Environment overrides this line --
# which is how the port stayed 8001 after this file already said otherwise.

[auth]
# Two ways in, because the client already speaks both. `src/api.rs` builds one
# Authorization header at startup and sends it on every request: `Bearer <token>`
# when a token is set, `Basic base64(user:pass)` otherwise. Nothing on a client
# changes to turn this on -- give it the same credential and it keeps working.
#
# WITH NOTHING HERE, NOTHING IS CHECKED, and the service says so at startup.
# That is deliberate: upgrading the binary should not lock somebody out of their
# own library until they have read the release notes.

# The owner. Full access: settings, artwork, downloads, everything.
# token = "a long random string"

# Everyone else. They can read the library and sync saves; they cannot change
# settings, install artwork, or alter what the next person sees.
#
# Never a plain password. Generate the line with:
#
#     moose-service --hash-password 'their password'
#
# [[auth.users]]
# name = "guest"
# password = "pbkdf2-sha256$600000$...$..."

# A shared account with no password, offered as "Continue as guest" under the
# sign-in form. Everyone who uses it is the same reader as far as the library is
# concerned: one set of saves, one set of states, shared between them. They can
# browse and keep their progress; they cannot change settings, install artwork,
# or delete anybody's save state.
#
# Off unless you say so, because switching it on means anyone who can reach the
# port can read the library.
# guest = true

# A browser can send neither header, so http://<host>/login trades either
# credential for a session cookie. Sessions are held in memory: a restart signs
# everyone out, which costs one login and means there is no key to keep.
#
# This is plain HTTP on a LAN. A token on the wire is a token anyone on that
# network can read; if that matters, put the whole thing behind WireGuard or
# Tailscale and treat this as the second lock rather than the first.
