
  <system>
        <fullname>OD-Commander</fullname>
        <name>odcommander</name>
        <manufacturer>Tools</manufacturer>
        <release>2022</release>
        <hardware>port</hardware>
        <path>ROMS/odcommander</path>
        <extension>.odc</extension>
        <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>odcommander</platform>
        <theme>odcommander</theme>
        <group>tools</group>
        <emulators>
            <emulator name="odcommander">
                <cores>
                    <core default="true">odcommander</core>
                </cores>
            </emulator>
        </emulators>
  </system>
